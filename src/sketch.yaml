# Arduino CLI project file: pins the board package and libraries, like platformio.ini did.
# Profiles install into arduino-cli's own cache and ignore the user's sketchbook libraries,
# so a build is reproducible and does not depend on (or change) the local Arduino setup.
#
#   arduino-cli compile --profile cores3 src
#   arduino-cli upload  --profile cores3 -p COM6 src
#
# Board options (same as the PlatformIO build): USB CDC on boot (Serial = USB),
# core debug level "error" (= CORE_DEBUG_LEVEL=1), PSRAM enabled, 16 MB flash.
profiles:
  cores3:
    notes: M5Stack CoreS3 / CoreS3 SE, Espressif Arduino core 3.x (official)
    fqbn: esp32:esp32:m5stack_cores3:CDCOnBoot=cdc,DebugLevel=error,PSRAM=enabled,FlashSize=16M,PartitionScheme=app3M_fat9M_16MB,UploadSpeed=921600
    platforms:
      - platform: esp32:esp32 (3.3.11)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - M5Unified (0.2.28)
      - M5GFX (0.2.35)
      - Adafruit NeoPixel (1.15.5)

default_profile: cores3
