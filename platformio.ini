[env:m5stack-cores3]
; pioarduino: Arduino core 3.3.11 / ESP-IDF 5.5.5 (core 3.x is needed for NAPT on the AP).
; Not 55.03.312: its engine check rejects PlatformIO 6.2.0 ("6.2.0-post.1"),
; pioarduino/platform-espressif32#563. Revisit when a fixed release is out.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    m5stack/M5Unified@0.2.28
    m5stack/M5GFX@0.2.35
    adafruit/Adafruit NeoPixel@1.15.5
