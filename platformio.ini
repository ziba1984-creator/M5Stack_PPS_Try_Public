[env:m5stack-cores3]
platform = espressif32@6.10.0
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    m5stack/M5Unified@0.2.28
    m5stack/M5GFX@0.2.35
    adafruit/Adafruit NeoPixel@1.12.3
